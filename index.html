<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input, button {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #5cb85c;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #4cae4c;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 4px;
            text-align: center;
        }
        #result h4 {
            color: #333;
            margin-top: 0;
        }
        #result img {
            max-width: 100%;
            height: auto;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #result p {
            color: #555;
            font-size: 14px;
            word-wrap: break-word; 
        }
        #result p.error {
            color: #d9534f;
            background-color: #f2dede;
            border-color: #ebccd1;
            padding: 10px;
            border-radius: 4px;
        }
        .info-box {
            background-color: #e9e9e9;
            border-radius: 4px;
            padding: 10px;
            margin-top: 15px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Pembayaran QRIS via Midtrans</h2>
        <form id="paymentForm">
            <label for="orderId">ID Pesanan:</label>
            <input type="text" id="orderId" value="ORDER-123" required>
            
            <label for="amount">Jumlah:</label>
            <input type="number" id="amount" value="50000" required>
            
            <button type="submit">Buat Pembayaran QRIS</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const orderId = document.getElementById('orderId').value;
            const amount = document.getElementById('amount').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<p>Membuat transaksi...</p>';

            try {
                const response = await fetch('/api/create-qris', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ orderId, amount }),
                });

                const data = await response.json();
                console.log('Respons Midtrans:', data); 

                if (response.ok && data.status_code === '201') {
                    const qrImageUrl = data.actions.find(action => action.name === 'generate-qr_code')?.url;
                    const qrString = data.qr_string;

                    resultDiv.innerHTML = `
                        <h4>Silakan Scan QR Code ini</h4>
                        ${qrImageUrl ? `<img src="${qrImageUrl}" alt="Kode QRIS">` : '<p class="error">Gambar QR tidak ditemukan.</p>'}
                        
                        <div class="info-box">
                            <p><strong>QRIS Data String (MPM):</strong></p>
                            <p>${qrString || 'Tidak tersedia'}</p>
                            <p>Salin teks ini untuk simulasi pembayaran di <a href="https://simulator.sandbox.midtrans.com/" target="_blank">Midtrans QRIS Simulator</a>.</p>
                        </div>
                        
                        <p>Selesaikan pembayaran dalam 15 menit.</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">Gagal membuat transaksi: ${data.status_message || 'Terjadi kesalahan'}</p>`;
                }

            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<p class="error">Terjadi kesalahan. Silakan coba lagi.</p>';
            }
        });
    </script>
</body>
</html>
